# JobHelper LLM 供应商配置模板
# 将此文件复制为 config.yaml 并填入你的真实信息
# config.yaml 已在 .gitignore 中排除，不会被提交到仓库
#
# 每个供应商配置包含以下字段：
#   name     - 供应商标识名，用于区分多个配置（必填，不可重复）
#   protocol - 协议类型，可选值：anthropic | openai（必填）
#   model    - 模型名称（必填）
#   base_url - API 端点地址（必填）
#   api_key  - 认证密钥（必填，请勿提交到版本控制）
#   thinking - 是否启用扩展思考，仅 protocol=anthropic 时生效（可选，默认 false）

- name: "claude"
  protocol: "anthropic"
  model: "claude-sonnet-4-5-20250929"
  base_url: "https://api.anthropic.com"
  api_key: "sk-ant-your-key-here"
  thinking: false

- name: "gpt"
  protocol: "openai"
  model: "gpt-4o"
  base_url: "https://api.openai.com/v1"
  api_key: "sk-your-key-here"
